name: DevSecOps Pipeline
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - run: semgrep scan --config p/python --error

  sca:
    name: SCA (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt

  dast:
    name: DAST (OWASP ZAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the app
        run: |
          docker build -t demo-app .
          docker run -d -p 5000:5000 demo-app
          for i in $(seq 1 20); do curl -sf http://localhost:5000/ && break; sleep 2; done
      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: "http://localhost:5000"
          fail_action: true
          allow_issue_writing: false
          cmd_options: "-a"

  quality-gate:
    name: Quality Gate
    needs: [sast, sca, dast]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate results
        run: |
          echo "SAST: ${{ needs.sast.result }}"
          echo "SCA:  ${{ needs.sca.result }}"
          echo "DAST: ${{ needs.dast.result }}"
          if [ "${{ needs.sast.result }}" != "success" ] || \
             [ "${{ needs.sca.result }}" != "success" ] || \
             [ "${{ needs.dast.result }}" != "success" ]; then
            echo "QUALITY GATE FAILED"
            exit 1
          fi
          echo "QUALITY GATE PASSED"